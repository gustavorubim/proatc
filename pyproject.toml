[project]
name = "proatc"
version = "0.21.1"
description = "Free voice ATC for X-Plane 12: bring your own OpenRouter key, local speech-to-text and text-to-speech"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "numpy>=1.26",
    "scipy>=1.13",
    "sounddevice>=0.5",
    "pynput>=1.7",
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4",
    # NVIDIA runtime libraries so speech-to-text can use the GPU; unused on machines without one
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
    "pygame-ce>=2.5",
    "ptts>=0.7.1",
]

[project.scripts]
proatc = "proatc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.uv]
build-constraint-dependencies = [
    "packaging==26.3", "pathspec==1.1.1", "pluggy==1.7.0", "tomlkit==0.15.2", "trove-classifiers==2026.9.21.13",
]
# Every system an installer is built for must have a wheel for every dependency.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
# Pinned: the installed app builds the engine with these on each new machine, so an unpinned release would be
# fetched from PyPI and run there. uv.lock does not cover build tools; their own dependencies are pinned below.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proatc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]  # long lines are left to the formatter; zip() inputs here are sim arrays of matching length
