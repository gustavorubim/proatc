appId: com.gustavorubim.proatc
productName: Pro ATC
copyright: Copyright © Pro ATC contributors

directories:
  output: dist

files:
  - out/**
  - package.json

# The page is also served to a phone or tablet by the engine, which cannot read inside the archive.
asarUnpack:
  - out/renderer/**

# Switch off the ways a packaged Electron app can be made to run other code: as a plain
# Node.js runtime, through NODE_OPTIONS or --inspect, or from files outside the archive.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

# The engine is shipped next to the app, outside the asar archive: its Python source and lock
# file, and the uv binary that builds its environment on the user's machine at first run.
extraResources:
  - from: src/proatc
    to: engine/src/proatc
    filter:
      - '**/*.py'
  - from: pyproject.toml
    to: engine/pyproject.toml
  - from: uv.lock
    to: engine/uv.lock

# Each platform carries its own uv binary (scripts/fetch-uv.mjs fetches the one for the machine
# the build runs on).
win:
  target:
    - target: nsis
      arch: x64
  artifactName: ProATC-${version}-windows-${arch}-setup.${ext}
  extraResources:
    - from: vendor/uv
      to: bin
      filter:
        - uv.exe

# macOS, Apple Silicon. There is no Apple developer certificate, so the app is signed ad hoc
# ("-"): enough for it to run on Apple Silicon, not enough for Gatekeeper, which asks the user
# to allow it the first time. The zip is what an update would be read from.
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.simulation-games
  artifactName: ProATC-${version}-mac-${arch}.${ext}
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: Pro ATC records your voice while you hold push-to-talk, to understand your radio calls. The audio stays on this computer.
  extraResources:
    - from: vendor/uv
      to: bin
      filter:
        - uv

linux:
  target:
    - target: AppImage
      arch: x64
  category: Game
  executableName: proatc
  artifactName: ProATC-${version}-linux-${arch}.${ext}
  extraResources:
    - from: vendor/uv
      to: bin
      filter:
        - uv

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Where the installed app looks for updates. Nothing is uploaded by electron-builder itself
# (the release workflow does that); this only writes the address into the app and produces
# latest.yml, the file that describes the newest version.
publish:
  provider: github
  owner: gustavorubim
  repo: proatc
