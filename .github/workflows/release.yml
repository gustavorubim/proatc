name: Release

# Push a tag like v0.2.0 to build the installers (Windows, macOS on Apple Silicon, Linux) and
# attach them to a draft GitHub release. Review the draft, then publish it: only once every
# build job and the publish job that attaches their files have finished, or the release goes
# out without its files.
#
# The build jobs run npm and PyPI packages, so they get a read-only token; only the publish
# job, which runs nothing but the upload, may write to the release.
#
# A tag with a suffix, like v0.5.0-beta.1, makes a pre-release: it never becomes "latest".
#
# What gets published is what was tested. The installer is built once, then the app from
# that same build is started and checks itself: it builds the engine's Python environment
# from the lock file with the uv it carries, starts the engine, loads every dependency and
# connects its window to it. Only if that passes is the installer uploaded.
#
# Run it by hand from the Actions tab for a rehearsal: everything above happens, nothing is
# published, and the installer is kept as a workflow artifact for three days.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# Read-only by default; the jobs that touch the release ask for write access themselves.
permissions:
  contents: read

jobs:
  # Lint and unit tests on the tagged commit. The packaged-app test is left to the build
  # job below, which runs it on the real installer's contents.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      skip-packaged-app: true

  draft:
    name: Create draft release
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match package.json and pyproject.toml
        run: |
          version=$(node -p "require('./package.json').version")
          engine=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version."
            echo "Run: npm run version:set -- ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          case "$version" in
            *-*) ;; # a pre-release keeps the engine's plain version
            *)
              if [ "$engine" != "$version" ]; then
                echo "pyproject.toml version $engine does not match package.json version $version."
                exit 1
              fi
              ;;
          esac

      - name: Create the draft (skipped if it exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease

  build:
    name: Build and test (${{ matrix.name }})
    needs: [checks, draft]
    # The draft job is skipped in a rehearsal; that must not skip the build.
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `files` is what gets published: the installer, and what an installed copy needs to
          # find and download an update (the .yml names the newest version and its checksum).
          - name: Windows x64
            os: windows-latest
            artifact: installer-windows-x64
            installer: dist/ProATC-*-windows-x64-setup.exe
            permanent: ProATC-windows-x64-setup.exe
            files: dist/*.exe dist/*.exe.blockmap dist/latest.yml
          - name: macOS arm64
            os: macos-latest
            artifact: installer-mac-arm64
            installer: dist/ProATC-*-mac-arm64.dmg
            permanent: ProATC-mac-arm64.dmg
            files: dist/*.dmg dist/*.zip dist/latest-mac.yml
          - name: Linux x64
            os: ubuntu-24.04
            artifact: installer-linux-x64
            installer: dist/ProATC-*-linux-x86_64.AppImage
            permanent: ProATC-linux-x86_64.AppImage
            files: dist/*.AppImage dist/latest-linux.yml
    # Read-only: this job runs npm and uv packages, so it holds no token that could change the
    # release. It hands its files to the publish job below as a workflow artifact.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb

      # No build cache: what is released is always built from scratch.
      - name: Install
        run: npm ci

      # Fetches the uv binary that ships in the app and checks it against the checksum pinned
      # in scripts/fetch-uv.mjs, then builds the interface and the installer. There is no
      # code-signing certificate: Windows SmartScreen and macOS Gatekeeper warn on first run.
      - name: Package the installer
        run: npm run dist

      # The app that was just packaged, not a separate test build.
      - name: Test the packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run smoke
          else
            npm run smoke
          fi

      # A copy of the installer under a name without the version, so that a link to
      # releases/latest/download/<name> (as in the README) always gives the newest one.
      - name: Add the installer under its permanent name
        shell: bash
        run: cp ${{ matrix.installer }} dist/${{ matrix.permanent }}

      - name: List what will be published
        shell: bash
        run: ls -la ${{ matrix.files }}

      # Exactly the files that go on the release, side by side in one folder.
      - name: Gather what will be published
        shell: bash
        run: |
          mkdir publish
          cp ${{ matrix.files }} publish/

      # In a rehearsal this is all that is kept. On a tag, the publish job attaches it to the draft.
      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: publish/
          retention-days: 3
          if-no-files-found: error

  # The only job that can change the release. It runs no code from the repository or its
  # dependencies: it takes the files the build legs tested and attaches them to the draft.
  # Like before, a leg that passed is attached even when another leg failed.
  publish:
    name: Attach the installers to the draft release
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: publish
          merge-multiple: true

      - name: Attach the installers to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(publish/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No build leg produced files to publish."
            exit 1
          fi
          ls -la "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
